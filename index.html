<style>
/* Layout: single phone column, fixed bottom tab bar; trading cards are the one ornate element */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#14181f; --muted:#5d6774; --line:#d9dee5;
  --accent:#ff5a1f; --accent-soft:#ffe6db; --good:#1f9d63; --warn:#c98a00; --down:#d23c3c;
  --display:"Bricolage Grotesque","Anuphan",system-ui,sans-serif;
  --body:"Anuphan",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#181e26; --fg:#eef2f6; --muted:#9aa5b2; --line:#2a323d;
  --accent:#ff7440; --accent-soft:#3a2117; --good:#3ccf8a; --warn:#f0b43c; --down:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181e26; --fg:#eef2f6; --muted:#9aa5b2; --line:#2a323d;
  --accent:#ff7440; --accent-soft:#3a2117; --good:#3ccf8a; --warn:#f0b43c; --down:#ff6b6b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 100px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1} h2{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:#fff;padding:12px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:12px;align-items:center} .between{justify-content:space-between} .wrapr{flex-wrap:wrap}
input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
select{background:var(--surface);width:100%}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)} .sync.on i{background:var(--good)}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:var(--line)} .ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--fg);font-family:var(--display);font-weight:800}
.streak{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--accent)}
.nudge{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-weight:600}
.nudge.ok{background:transparent;border:1px solid var(--good);color:var(--good)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}
.day{padding:6px 0;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.day.done{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.day.today{border:2px solid var(--accent);color:var(--fg);font-weight:700}
.day.rest{border-style:dashed}
/* exercise cards */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--good)}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-name{font-weight:700;font-size:16px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.cmp>div{background:var(--bg);border-radius:8px;padding:6px 10px}
.cmp b{display:block;font-size:15px;font-family:var(--display)}
.up{color:var(--good)} .dn{color:var(--down)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 58px 1fr 1fr 44px;gap:6px;align-items:center}
.set input{width:100%;text-align:center;font-variant-numeric:tabular-nums}
.set .idx{color:var(--muted);font-size:13px;text-align:center}
.set .prev{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;line-height:1.2}
.tick{height:42px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:800}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.pr{font-size:11px;font-weight:700;background:var(--warn);color:#fff;border-radius:999px;padding:2px 8px}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.edrow{display:grid;grid-template-columns:1fr 52px 52px 36px;gap:6px;align-items:center}
.edrow input{width:100%} .edrow input[type=number]{text-align:center}
.pose{flex:0 0 auto;width:56px;height:56px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:4px;display:grid;place-items:center}
.pose svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pose svg .eq{stroke:var(--accent)}
.pose.sm{width:40px;height:40px;padding:2px}
.posebig{width:min(70vw,260px);aspect-ratio:1;background:var(--surface);color:var(--fg);border-radius:20px;padding:16px}
.posebig svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.posebig svg .eq{stroke:var(--accent)}
.tips{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px 16px;width:min(86vw,340px)}
.tips ul{margin:6px 0 0;padding-left:20px}
.exhead2{display:flex;gap:12px;align-items:center}
.edrow.wi{grid-template-columns:40px 1fr 48px 48px 32px}
.x{background:transparent;color:var(--down);font-size:20px;height:40px}
.chart{width:100%;height:auto} .chart text{fill:var(--muted);font-size:11px}
/* ===== trading cards ===== */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* การ์ดสไตล์เกมการ์ดมอนสเตอร์: กรอบเหลือง พื้นในสีตามธาตุ */
.card{--c1:#f2c522;--c2:#ffe57a;--t1:#f7d7b8;--t2:#fff1e2;--tk:#d9541e;position:relative;aspect-ratio:63/88;max-width:100%;border-radius:4.5%/3.2%;padding:4.2%;
  background:linear-gradient(160deg,var(--c2),var(--c1) 40%,var(--c2) 60%,var(--c1));color:#1a1a1a;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:clamp(6.5px,2.3vw,11px);cursor:pointer;text-align:left;width:100%;font-family:var(--body)}
.card .in{flex:1;background:linear-gradient(180deg,var(--t1),var(--t2) 45%,var(--t1));border-radius:2.5%/1.8%;padding:3% 4%;display:flex;flex-direction:column;gap:2.2%;position:relative;z-index:1}
.card .top{display:flex;align-items:center;gap:3%;font-weight:700}
.card .stg{font-size:.62em;font-weight:800;font-style:italic;background:linear-gradient(90deg,#9aa3ad,#e7ebef);padding:.1em .5em;border-radius:1em;white-space:nowrap}
.card .top .nm{flex:1;min-width:0;font-family:var(--display);font-size:1.3em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hp{font-family:var(--display);white-space:nowrap;font-size:1.15em;color:#c0281f} .card .hp small{font-size:.55em}
.en{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--tk);color:#fff;font-size:.8em;font-weight:800;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.7);flex:0 0 auto}
.en.cl{background:#e9e4d6;color:#666}
.card .art{aspect-ratio:16/11;border:.35em solid;border-image:linear-gradient(135deg,#b48a2c,#fff0b0,#a77a1b,#f8e08e) 1;overflow:hidden;position:relative;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.card .art svg{width:100%;height:100%;display:block}
.card .meta{font-size:.68em;font-style:italic;text-align:center;background:linear-gradient(90deg,#b8902e,#f6dd8a,#b8902e);color:#3a2a00;padding:.15em 0;margin:0 6%;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .atk{display:flex;align-items:center;gap:3%;font-weight:800;padding-top:3%}
.card .atk .an{flex:1;min-width:0;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .atk .dmg{font-family:var(--display);font-size:1.3em}
.card .flv{font-size:.7em;color:#333;line-height:1.3;flex:1;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:2%}
.card .wrr{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:.6em;text-align:center;gap:2%;line-height:1.2}
.card .wrr b{display:block;font-size:1.1em}
.card .foot{display:flex;justify-content:space-between;font-size:.58em;font-weight:700;align-items:center;opacity:.85}
.rar{font-family:var(--display);font-size:1.3em;letter-spacing:.05em}
.card.ty-pull{--t1:#bcd7f7;--t2:#e9f3ff;--tk:#2c74d6}
.card.ty-legs{--t1:#c9ebb6;--t2:#effae6;--tk:#3c9c3a}
.card.ty-other{--t1:#d7dce2;--t2:#f3f5f7;--tk:#7a8592}
.card.r-SR::after,.card.r-SAR::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:linear-gradient(115deg,transparent 20%,#ff8ad8 35%,#8affef 45%,#fff79a 55%,transparent 70%);background-size:250% 250%;animation:holo 4s linear infinite}
/* ระดับตามการ์ดยุค Scarlet & Violet: C/U/R กรอบเงิน · RR = ex โฮโล · AR/SR/SAR/UR = ภาพเต็มใบ */
.card{--c1:#aab2bb;--c2:#f0f3f6}
.card.r-R .art::after,.card.r-RR .art::after{content:"";position:absolute;inset:0;mix-blend-mode:overlay;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.75) 45%,transparent 60%);background-size:300% 100%;animation:holo 5s linear infinite}
.card.r-RR .art::after{mix-blend-mode:color-dodge;opacity:.6;background:linear-gradient(115deg,transparent 20%,#ff8ad8 35%,#8affef 45%,#fff79a 55%,transparent 70%);background-size:250% 250%}
.card .exm{font-style:italic;font-weight:800;font-family:var(--display);color:#d6261f;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #000;font-size:1.1em;margin-left:.15em}
.card.fa{padding:3%}
.card.fa .in{background:transparent;overflow:hidden;color:#fff}
.card.fa .art{position:absolute;inset:0;border:0;aspect-ratio:auto;z-index:-1;box-shadow:none}
.card.fa .meta{background:rgba(0,0,0,.35);color:#ffeaa6}
.card.fa .flv{color:#fff;border-color:rgba(255,255,255,.4);flex:0}
.card.fa .atk{margin-top:auto}
.card.fa .top,.card.fa .wrr,.card.fa .foot,.card.fa .atk,.card.fa .flv{text-shadow:0 1px 3px #000}
.card.fa .hp{color:#ffd166} .card.fa .stg{color:#111;text-shadow:none}
.card.fa .in>*:not(.art){position:relative}
.card,.card *{box-sizing:border-box}
.card.fa .in::before{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.72));z-index:0}
.card.r-AR{--c1:#d9dee4;--c2:#fff}
.card.r-AR .in{color:#1a1a1a} .card.r-AR .in::before{background:linear-gradient(transparent,rgba(255,255,255,.85))}
.card.r-AR .top,.card.r-AR .wrr,.card.r-AR .foot,.card.r-AR .atk,.card.r-AR .flv{text-shadow:0 0 4px #fff;color:#1a1a1a} .card.r-AR .hp{color:#c0281f} .card.r-AR .flv{border-color:rgba(0,0,0,.25)}
.card.r-SR{--c1:#b9c2cc;--c2:#f4f6f9}
.card.r-SAR{--c1:#c9a24a;--c2:#fff2c4}
.card.r-UR{--c1:#a9781c;--c2:#ffe9a0}
.card.r-UR .art svg{filter:sepia(1) saturate(2.6) hue-rotate(-12deg) brightness(1.05) contrast(1.1)}
.card.r-UR .in{color:#fff3c4}
.card.r-UR .meta{background:linear-gradient(90deg,#7a5410,#d9a93a,#7a5410);color:#fff6d8}
.card.r-UR::after,.card.r-SR::after,.card.r-SAR::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;background:linear-gradient(115deg,transparent 20%,#ff8ad8 35%,#8affef 45%,#fff79a 55%,transparent 70%);background-size:250% 250%;animation:holo 4s linear infinite}
.card.r-UR::after{background:linear-gradient(115deg,transparent 25%,#fff3b0 45%,#ffd35a 50%,transparent 65%);background-size:250% 250%}
.card.r-SR .art svg{filter:saturate(1.2)}
@keyframes holo{0%{background-position:0% 0%}100%{background-position:250% 250%}}
.card.locked{background:var(--surface);border:2px dashed var(--line);box-shadow:none;color:var(--muted);justify-content:center;align-items:center;text-align:center;padding:8%}
.card.locked::after{display:none}
.card.locked .q{font-family:var(--display);font-size:3em;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tiers{display:flex;gap:4px;flex-wrap:wrap}
.tier{font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-weight:700}
.tier.got{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,8,12,.85);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.ov .big{width:min(78vw,340px)} .ov .big .card{font-size:clamp(10px,3.3vw,15px);cursor:default}
.ov .title{color:#fff;font-family:var(--display);font-size:22px;text-align:center}
.ov .big.reveal{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.flip{position:relative;width:min(78vw,340px);aspect-ratio:63/88;perspective:1200px;cursor:pointer}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.flip .back{border-radius:4.5%/3.2%;overflow:hidden;box-shadow:0 0 34px var(--rc);background:#0d1a3a}
.flip .back svg{width:100%;height:100%;display:block}
.flip .back .sw{transform-origin:126px 176px;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flip .front{transform:rotateY(180deg)} .flip .front .card{font-size:clamp(10px,3.3vw,15px);cursor:default;height:100%}
.flip.wait .back{animation:shake var(--sp) ease-in-out infinite}
.flip.open .back{transform:rotateY(-180deg)} .flip.open .front{transform:rotateY(0)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.02)}75%{transform:rotate(3deg) scale(1.02)}}
.burst{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:55}
.burst .rays{position:absolute;left:-60vmax;top:-60vmax;width:120vmax;height:120vmax;border-radius:50%;background:repeating-conic-gradient(var(--rc) 0 6deg,transparent 6deg 18deg);opacity:0;animation:rays 2.4s ease-out forwards;mask:radial-gradient(circle,#000 10%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%)}
.burst .flash{position:fixed;inset:0;background:#fff;opacity:0;animation:flash .6s ease-out}
.burst i{position:absolute;width:10px;height:10px;border-radius:2px;background:var(--c);animation:fly 1.4s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes rays{0%{opacity:0;transform:scale(.3) rotate(0)}20%{opacity:.8}100%{opacity:0;transform:scale(1) rotate(60deg)}}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.ov .hint{color:#cfd6e4;font-size:14px}
.card.sil{background:#15181d!important;box-shadow:0 0 0 1px #2a2f37,0 2px 8px rgba(0,0,0,.4)}
.card.sil>.in{filter:brightness(0);opacity:.92}
.card.sil::after{display:none!important}
.card.sil .lockb{background:#2b313b;border:1px solid #4a5260;color:#e8ecf2}
.card.sil::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-family:var(--display);font-weight:800;font-size:4em;color:rgba(255,255,255,.8);text-shadow:0 0 18px rgba(120,170,255,.8)}
.pack{width:min(62vw,240px);aspect-ratio:5/8;border-radius:10px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;
 background:linear-gradient(135deg,#1b2a6b,#5b2bb0 40%,#ff5a1f 70%,#ffd447);box-shadow:0 0 40px rgba(255,140,60,.6),inset 0 0 0 4px rgba(255,255,255,.35);animation:shake .5s ease-in-out infinite;position:relative;overflow:hidden}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:300% 100%;animation:holo 3s linear infinite}
.pack .pk1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.06em}.pack .pk2{font-weight:700;letter-spacing:.2em;font-size:12px}.pack .pk3{background:#fff;color:#111;border-radius:999px;padding:2px 12px;font-weight:800;font-size:12px}
.packbox .btn:disabled{cursor:not-allowed}
@keyframes pop{0%{transform:rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;padding:12px 0 10px;color:var(--muted);font-size:12px;font-weight:600;border-radius:0}
nav button[aria-current="true"]{color:var(--accent)}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:60}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ข้อมูลเก็บบน Supabase: ตาราง app_docs (1 แถวต่อ settings หรือ 1 วัน) + สำเนาในเครื่อง */
const timers={};let SB=null,UID=null;
function persist(key){
  local.put();
  if(!SB||!UID)return;
  clearTimeout(timers[key]);
  timers[key]=setTimeout(async()=>{
    const body=key==='settings'?{kind:'settings',...C}:{kind:'log',date:key,...LOG[key]};
    const {error}=await SB.from('app_docs').upsert({user_id:UID,key:key==='settings'?'settings':'d'+key,data:JSON.parse(JSON.stringify(body)),updated_at:new Date().toISOString()});
    if(error){syncState(false);toast('บันทึกขึ้นคลาวด์ไม่สำเร็จ เก็บไว้ในเครื่องก่อน')}else syncState(true);
  },600);
}
async function pull(){
  if(!SB||!UID)return;
  const {data,error}=await SB.from('app_docs').select('key,data');
  if(error){syncState(false);return}
  if(!data.length&&Object.keys(LOG).length){persist('settings');Object.keys(LOG).forEach(persist)}
  else data.forEach(({data:v})=>{if(!v)return;
    if(v.kind==='settings'){const{kind,...rest}=v;C={...DEFAULT,...rest}}
    else if(v.kind==='log'&&(v.date!==TK||!dirtyToday)){const{kind,date,...rest}=v;LOG[date]=rest}});
  local.put();syncState(true);
  if(!document.activeElement||document.activeElement.tagName!=='INPUT')render();
}
function signedIn(s){
  if(!s||UID===s.user.id)return;

}
async function boot(){

  SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  SB.auth.onAuthStateChange((ev,s)=>{if(s)signedIn(s)});
  const {data:{session}}=await SB.auth.getSession();
  if(session)signedIn(session);else showLogin();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
  window.addEventListener('online',()=>{persist('settings');pull()});
}

  const say=t=>{FORGE.msg=t;const e=document.getElementById('forgest');if(e)e.textContent=t};
  if(!key){say('ใส่ Gemini API key ก่อน');return}if(!SB||!UID){say('ต้องเข้าสู่ระบบก่อน');return}
  try{localStorage.setItem('gemkey',key);localStorage.setItem('gemmodel',model)}catch(e){}
  const n=Math.max(0,Math.min(500,+(document.getElementById('gcount')||{}).value||0));
  if(n)forgePlan(n);
  const todo=(C.pool||[]).filter(p=>!p.img);if(!todo.length){say('ทุกใบมีรูปแล้ว');return}
  FORGE.busy=true;FORGE.stop=false;render();let ok=0,fail=0,last='',i=0;
  const worker=async()=>{while(i<todo.length&&!FORGE.stop){const p=todo[i++];
    try{await forgeOne(p,key,model);ok++;persist('settings')}catch(e){fail++;last=e.message||String(e)}
    say(`กำลังเจน ${ok+fail}/${todo.length} · สำเร็จ ${ok}${fail?` · พลาด ${fail} (${last})`:''}`)}};
  await Promise.all([worker(),worker(),worker()]);
  FORGE.busy=false;render();say(`${FORGE.stop?'หยุดแล้ว':'เสร็จ'}: สำเร็จ ${ok} ใบ${fail?` · พลาด ${fail} ใบ (${last}) กดทำต่อเพื่อเจนใบที่พลาด`:''}`);
}

function rollTier(minIdx=0){let r=Math.random()*100,acc=0;const rs=RATES.slice(minIdx),tot=rs.reduce((a,x)=>a+x[1],0);r=r*tot/100;
  for(const [t,w] of rs){acc+=w;if(r<acc)return t}return rs[0][0]}
function openPack(){
  if((C.coins||0)<PACK_COST){toast(`coin ไม่พอ ต้องมี ${PACK_COST}`);return}
  C.coins-=PACK_COST;C.pulls=C.pulls||{};
  const res=[];for(let i=0;i<PACK_SIZE;i++){const t=i===PACK_SIZE-1?rollTier(2):rollTier(); // ใบสุดท้ายการันตี R ขึ้นไป
    let opts=getPool().filter(p=>p.tier===t);if(!opts.length)opts=getPool();const p=opts[Math.floor(Math.random()*opts.length)];
    const isNew=!C.pulls[p.id]&&!res.some(x=>x.id===p.id);C.pulls[p.id]=(C.pulls[p.id]||0)+1;if(!C.seen.includes(p.id))C.seen.push(p.id);res.push({...poolCard(p),isNew})}
  persist('settings');
  const order=res.map((c,i)=>[c,i]).sort((a,b)=>TIERS.findIndex(t=>t[0]===a[0].tier)-TIERS.findIndex(t=>t[0]===b[0].tier)).map(x=>x[0]);
  const ov=document.getElementById('ovl');
  ov.innerHTML=`<div class="ov" role="dialog" aria-label="เปิดซองการ์ด"><div class="title">ซองการ์ด Rep Ledger</div>
   <button class="pack" id="packtear" aria-label="แตะเพื่อฉีกซอง"><span class="pk1">REP LEDGER</span><span class="pk2">BOOSTER PACK</span><span class="pk3">5 CARDS</span></button>
   <div class="hint">แตะซองเพื่อฉีก</div></div>`;
  document.getElementById('packtear').onclick=()=>{let i=0;const next=()=>{const c=order[i];
    unlockFX(c,1,bt=>{const h=document.getElementById('hint');if(h&&c.isNew)h.textContent+=' · ใบใหม่!';
      bt.textContent=i<order.length-1?`ถัดไป (${i+1}/${order.length})`:'ดูสรุป';
      bt.onclick=ev=>{ev.stopPropagation();i++;if(i<order.length)next();else summary()}});
    const t=document.querySelector('#ovl .title');if(t)t.textContent=`ใบที่ ${i+1}/${order.length}`};next()};
  const summary=()=>{ov.innerHTML=`<div class="ov" id="ovbg" role="dialog" aria-label="สรุปซอง"><div class="title">ได้การ์ด ${order.length} ใบ</div>
    <div class="cards" style="width:min(92vw,420px)">${order.map(c=>`<div style="position:relative">${cardHTML(c)}${c.isNew?'<span class="lockb" style="bottom:auto;top:4%;background:#ff5a1f">NEW</span>':''}</div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="ovclose" style="color:#fff;border-color:#fff6">ปิด</button>${(C.coins||0)>=PACK_COST?'<button class="btn" id="packagain">เปิดอีกซอง</button>':''}</div></div>`;render()};
}
function awardCoins(){

function buildCards(){
  const out=[]; const st=streak(), days=Object.keys(LOG).filter(doneDay).length;
  allExercises().forEach(n=>{const have=exCount(n),type=exType(n),b=best(n,'');
    TIERS.forEach(([t,need,label],i)=>out.push({id:n+'|'+t,group:n,name:n,tier:t,need,have,got:have>=need,type,
      hp:Math.round(b*(1+i*.2))||need*10,sub:`${TYPE_TH[type]||'ธาตุพิเศษ'} · ${label}`,atkName:'ยกหนักสุด',atk:(b||0)+' kg',
      flavor:i>=4?`เล่นท่านี้ครบ ${need} ครั้ง ${FLAVOR[hash(n)%FLAVOR.length]}`:`ปลดล็อกเมื่อเล่น ${n} ครบ ${need} ครั้ง`,foot:`${have}/${need} ครั้ง`}))});
  [['First Step','C',1,days,'เข้ายิมครั้งแรก'],['Iron Week','R',7,st,'Streak 7 วัน'],['Unbreakable','SR',30,st,'Streak 30 วัน'],['Gym Legend','SAR',100,days,'เข้ายิมครบ 100 วัน']]
   .forEach(([n,t,need,have,f])=>out.push({id:'m|'+n,group:'milestone',name:n,tier:t,need,have:Math.min(have,need),got:have>=need||C.seen.includes('m|'+n),type:'other',
     hp:need*10,sub:'การ์ดความสำเร็จ',atkName:'Streak สูงสุด',atk:st+' วัน',flavor:f,foot:`${Math.min(have,need)}/${need}`}));
  return out;
}
function checkNewCards(){
  const fresh=buildCards().filter(c=>c.got&&!C.seen.includes(c.id));
  if(!fresh.length)return;
  fresh.forEach(c=>C.seen.push(c.id)); persist('settings');
  const top=fresh.sort((a,b)=>TIERS.findIndex(t=>t[0]===b.tier)-TIERS.findIndex(t=>t[0]===a.tier))[0];
  showCard(top,true,fresh.length);
}

function unlockFX(c,count,after){

  const ov=document.getElementById('ovl');
  ov.innerHTML=`<div class="ov" role="dialog" aria-label="ปลดล็อกการ์ด"><div class="title">ปลดล็อกการ์ดใหม่!${count>1?` (${count} ใบ)`:''}</div>
   <div class="flip wait" id="flip" style="--rc:${rc};--sp:${sp}" tabindex="0" role="button" aria-label="แตะเพื่อเปิดการ์ด"><div class="face back">${cardBack(rc,c.tier)}</div><div class="face front">${cardHTML(c,true)}</div></div>
   <div class="hint" id="hint">แตะการ์ดเพื่อเปิด</div><button class="btn" id="ovclose" hidden>เก็บเข้าคลัง</button></div>`;
  const f=document.getElementById('flip'); f.focus();
  const open=()=>{if(f.classList.contains('open'))return;f.classList.remove('wait');f.classList.add('open');
    const n=12+ti*14, cols=[rc,'#fff',ti>=4?'#8affef':rc,ti>=3?'#ffe27a':rc];
    const b=document.createElement('div');b.className='burst';b.style.setProperty('--rc',rc);
    b.innerHTML=(ti>=2?'<div class="rays"></div>':'')+(ti>=4?'<div class="flash"></div>':'')+Array.from({length:n},()=>{const a=Math.random()*6.283,r=120+Math.random()*(160+ti*40);
      return `<i style="--c:${cols[Math.random()*4|0]};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;animation-delay:${Math.random()*.2}s"></i>`}).join('');
    document.body.appendChild(b);setTimeout(()=>b.remove(),2600);
    try{navigator.vibrate&&navigator.vibrate(ti>=4?[60,40,60,40,120]:[40])}catch(e){}

function showCard(c,reveal,count){

  document.getElementById('ovl').innerHTML=`<div class="ov" id="ovbg" role="dialog" aria-label="การ์ด ${esc(c.name)}">
   ${reveal?`<div class="title">ได้การ์ดใหม่! ${c.tier}${count>1?` (+${count-1} ใบ)`:''}</div>`:''}
   <div class="big ${reveal?'reveal':''}">${c.got?cardHTML(c,true):cardHTML({...c,got:true,flavor:'ยังไม่ปลดล็อก · '+c.flavor},true).replace('class="card','class="sil card')}</div>

function todayLog(){const t=C.plan[today.getDay()]||'rest';
  if(t==='rest'||!prog(t))return null;
  const P=prog(t);
  if(!LOG[TK]||LOG[TK].type!==t){
    if(LOG[TK]&&doneDay(TK))return LOG[TK];
    LOG[TK]={type:t,sets:P.ex.map(x=>{const p=prevEntry(x.n);return{n:x.n,target:x.r,s:Array.from({length:x.s},(_,i)=>({w:p?(p.e.s[i]||p.e.s[0]).w:'',r:x.r,ok:false}))}})};
  }
  return LOG[TK]}
function ring(v,max){const r=40,c=2*Math.PI*r,p=Math.min(v/max,1);
  return `<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="เป้าสัปดาห์ ${v} จาก ${max}"><circle class="track" cx="48" cy="48" r="${r}"/><circle class="bar" cx="48" cy="48" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" font-size="20">${v}/${max}</text></svg>`}
function nextCardFor(n){const have=exCount(n);const t=TIERS.find(([,need])=>need>have);return t?{tier:t[0],left:t[1]-have,need:t[1],have}:null}

       <input id="r${ei}_${si}" type="text" inputmode="numeric" value="${s.r}" data-e="${ei}" data-s="${si}" data-k="r" aria-label="จำนวนครั้งเซ็ต ${si+1}">
       <button class="tick ${s.ok?'on':''}" data-tick="${ei}_${si}" aria-label="ทำเซ็ต ${si+1} เสร็จ">✓</button></div>`}).join('')}</div>
     ${nc?`<div><div class="row between small"><span class="muted">การ์ด ${nc.tier} ของท่านี้</span><span class="num muted">อีก ${nc.left} ครั้ง</span></div><div class="prog"><i style="width:${nc.have/nc.need*100}%"></i></div></div>`:''}
    </section>`}).join(''):'';
  return `<header class="row between"><div><div class="eyebrow">${today.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short'})}</div><h1>${esc(progName(t))}${L&&prog(t).sub?` <span class="muted" style="font-size:16px">${esc(prog(t).sub)}</span>`:''}</h1></div></header>
  <div class="sync ${synced?'on':''}" id="sync"><i></i> ${synced?'ซิงก์ทุกเครื่องแล้ว':'เก็บในเครื่องนี้เท่านั้น'}</div>
  <div class="hero">${ring(wd,C.weekGoal)}<div><div class="eyebrow">Streak</div><div class="streak num">${st} วัน</div><div class="muted">เป้าสัปดาห์นี้ ${wd}/${C.weekGoal} วัน</div></div></div>
  <div class="week">${week}</div>${nudge}
  ${L?`<div class="row between"><h2>ท่าวันนี้</h2><span class="muted num">${done}/${all} เซ็ต</span></div>${cards}`:''}`;
}

/* ---------- plan + custom programs ---------- */
function vPlan(){
  const keys=Object.keys(C.programs);
  return `<div><div class="eyebrow">ตารางประจำสัปดาห์</div><h1>แผนการเล่น</h1></div>
  <div class="list">${DAYS.map((d,i)=>`<div class="li"><b style="width:40px">${d}</b><select id="p${i}" data-day="${i}"><option value="rest" ${C.plan[i]==='rest'?'selected':''}>วันพัก</option>${keys.map(k=>`<option value="${k}" ${C.plan[i]===k?'selected':''}>${esc(C.programs[k].name)}</option>`).join('')}</select></div>`).join('')}</div>
  <div class="row between"><b>เป้าหมายกี่วันต่อสัปดาห์</b><select id="goal" style="width:90px">${[2,3,4,5,6,7].map(n=>`<option ${C.weekGoal===n?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="row between"><h2>โปรแกรมของผม</h2><button class="btn sm" id="addprog">+ โปรแกรมใหม่</button></div>
  ${keys.map(k=>{const P=C.programs[k];return `<div class="ex">
    <div class="row"><input id="pn_${k}" data-pname="${k}" value="${esc(P.name)}" style="flex:1;font-weight:700" aria-label="ชื่อโปรแกรม"><button class="x" data-delprog="${k}" aria-label="ลบโปรแกรม">×</button></div>
    <input id="ps_${k}" data-psub="${k}" value="${esc(P.sub||'')}" placeholder="กล้ามเนื้อที่เล่น เช่น อก / ไหล่" aria-label="คำอธิบาย">
    <div class="edrow wi muted small"><span>ภาพ</span><span>ท่า</span><span style="text-align:center">เซ็ต</span><span style="text-align:center">ครั้ง</span><span></span></div>
    ${P.ex.map((x,i)=>`<div class="edrow wi"><button class="pose sm" data-cyc="${k}|${i}" aria-label="เปลี่ยนภาพท่า (ตอนนี้: ${POSES[poseOf(x.n,x.icon||poseOf(x.n,'_'))].th})">${poseSVG(x.icon&&POSES[x.icon]?x.icon:poseOf(x.n,'_'))}</button><input id="en_${k}_${i}" data-ed="${k}|${i}|n" value="${esc(x.n)}" aria-label="ชื่อท่า"><input id="es_${k}_${i}" type="number" min="1" data-ed="${k}|${i}|s" value="${x.s}" aria-label="จำนวนเซ็ต"><input id="er_${k}_${i}" type="number" min="1" data-ed="${k}|${i}|r" value="${x.r}" aria-label="จำนวนครั้ง"><button class="x" data-delex="${k}|${i}" aria-label="ลบท่า">×</button></div>`).join('')}
    <button class="btn ghost sm" data-addex="${k}">+ เพิ่มท่า</button></div>`}).join('')}
  <p class="muted small">ภาพท่าเลือกให้อัตโนมัติจากชื่อท่า (ภาษาอังกฤษ) ถ้าไม่ตรง แตะที่ภาพเพื่อเปลี่ยน</p>
  <p class="muted small">เปลี่ยนชื่อท่าแล้ว ประวัติและการ์ดของชื่อเดิมยังอยู่ ไม่หาย</p>`;
}

/* ---------- card library ---------- */
let cardView='quest';
function viewTabs(){return `<div class="chips" role="tablist">${[['quest','การ์ดภารกิจ'],['pack','การ์ดสะสม (ซอง)']].map(([k,l])=>`<button class="chip" data-cview="${k}" aria-pressed="${cardView===k}" style="flex:1">${l}</button>`).join('')}</div>`}
function vPack(){const all=getPool().map(poolCard),got=all.filter(c=>c.got).length;
  return `<div><div class="eyebrow">การ์ดสะสม ${got} / ${all.length} ใบ</div><h1>คลังการ์ด</h1></div>${viewTabs()}
  ${packBox()}${forgeBox()}<div class="prog"><i style="width:${got/all.length*100}%"></i></div>
  <div class="tiers">${TIERS.map(([t])=>{const n=all.filter(c=>c.tier===t),g=n.filter(c=>c.got).length;return `<span class="tier ${g?'got':''}">${t} ${g}/${n.length}</span>`}).join('')}</div>
  <div class="cards">${all.map(c=>cardHTML(c)).join('')}</div>`}
function vCards(){
  if(cardView==='pack')return vPack();
  const all=buildCards(), got=all.filter(c=>c.got).length;
  const groups=['all','milestone',...allExercises()];
  const shown=all.filter(c=>cardFilter==='all'||c.group===cardFilter);
  const byTier=TIERS.map(([t])=>[t,all.filter(c=>c.tier===t&&c.got).length]);
  return `<div><div class="eyebrow">สะสมแล้ว ${got} / ${all.length} ใบ</div><h1>คลังการ์ด</h1></div>${viewTabs()}
  <div class="prog"><i style="width:${got/all.length*100}%"></i></div>
  <div class="tiers">${byTier.map(([t,n])=>`<span class="tier ${n?'got':''}">${t} ×${n}</span>`).join('')}</div>
  <div class="chips">${groups.map(g=>`<button class="chip" data-filter="${esc(g)}" aria-pressed="${cardFilter===g}">${g==='all'?'ทั้งหมด':g==='milestone'?'ความสำเร็จ':g==='pack'?'การ์ดสะสม (ซอง)':esc(g)}</button>`).join('')}</div>
  <div class="cards">${shown.map(c=>cardHTML(c)).join('')}</div>
  <div class="ex"><b>วิธีได้การ์ด</b><div class="list small">${TIERS.map(([t,n,l])=>`<div class="li"><span><span class="tier got">${t}</span> ${l}</span><span class="muted">เล่นท่านั้นครบ ${n} ครั้ง</span></div>`).join('')}</div>
  <div class="muted small">นับ 1 ครั้งต่อวัน เมื่อติ๊กเสร็จอย่างน้อย 1 เซ็ต · การ์ด SR และ SAR มีเอฟเฟกต์ประกาย</div>
  <button class="btn ghost sm" id="preview">ดูตัวอย่างการ์ดทุกระดับ</button></div>
  <div class="ex"><b>อัปโหลดรูปการ์ดทีละหลายรูป</b><div class="muted small">เลือกรูปทั้งหมดได้ในครั้งเดียว แอปจับคู่กับการ์ดจากชื่อไฟล์ เช่น Igniso_123.png, Pyroking_SAR_456.png</div>
  <label class="btn sm" style="text-align:center">${DRV_BUSY?'กำลังอัปโหลด...':'เลือกรูป'}<input type="file" id="bulkin" accept="image/*" multiple hidden ${DRV_BUSY?'disabled':''}></label><div class="small" id="drvst" aria-live="polite">${esc(DRV_MSG)}</div></div>
  ${UID?'<button class="btn ghost sm" id="logout">ออกจากระบบ</button>':''}<div class="muted small" style="text-align:center">เวอร์ชัน 7</div>`;
}

/* ---------- progress ---------- */
function vProgress(){
  const names=allExercises(); const sel=names.includes(pick)?pick:names[0];
  const pts=Object.keys(LOG).sort().map(d=>{const e=LOG[d].sets.find(x=>x.n===sel);return e&&okSets(e).length?{d,w:Math.max(...okSets(e).map(s=>+s.w||0)),v:vol(e)}:null}).filter(Boolean);
  let chart='<p class="muted">ยังไม่มีข้อมูลท่านี้ เล่นแล้วติ๊กเซ็ตที่หน้า "วันนี้" กราฟจะขึ้นตรงนี้</p>';
  if(pts.length){const W=320,H=160,pl=36,pb=22,mn=Math.min(...pts.map(p=>p.w)),mx=Math.max(...pts.map(p=>p.w)),lo=Math.floor(mn*.9),hi=Math.ceil(mx*1.05)||1;
    const x=i=>pl+(pts.length>1?i*(W-pl-10)/(pts.length-1):(W-pl)/2),y=v=>10+(H-pb-10)*(1-(v-lo)/(hi-lo||1));
    const line=pts.map((p,i)=>`${x(i)},${y(p.w)}`).join(' ');
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/><line x1="${pl}" x2="${W}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${pl-6}" y="${y(lo)+4}" text-anchor="end">${lo}</text><text x="${pl-6}" y="${y(hi)+4}" text-anchor="end">${hi}</text>
    <polygon points="${x(0)},${y(lo)} ${line} ${x(pts.length-1)},${y(lo)}" fill="var(--accent-soft)"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${x(pts.length-1)}" cy="${y(pts.at(-1).w)}" r="5" fill="var(--accent)"/>
    <text x="${x(0)}" y="${H-4}">${thDate(pts[0].d)}</text><text x="${W}" y="${H-4}" text-anchor="end">${thDate(pts.at(-1).d)}</text></svg>
    <div class="muted num">เริ่ม ${pts[0].w} kg → ล่าสุด ${pts.at(-1).w} kg (${pts.at(-1).w-pts[0].w>=0?'+':''}${pts.at(-1).w-pts[0].w} kg)</div>`}
  const hist=pts.slice().reverse().slice(0,10).map((p,i,a)=>{const prev=a[i+1];const d=prev?p.v-prev.v:0;
    return `<div class="li num"><span>${thDate(p.d)}</span><span>${p.w} kg สูงสุด</span><span class="muted">${p.v.toLocaleString()} kg ${prev?`<span class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'}</span>`:''}</span></div>`}).join('');
  return `<div><div class="eyebrow">น้ำหนักสูงสุดต่อครั้ง</div><h1>พัฒนาการ</h1></div>
  <select id="pick">${names.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select>${chart}
  <h2>ประวัติท่านี้</h2><div class="muted small">Volume = น้ำหนัก × จำนวนครั้ง รวมทุกเซ็ต · ▲▼ เทียบกับครั้งก่อน</div><div class="list">${hist||'<p class="muted">ยังไม่มีประวัติ</p>'}</div>`;
}

/* ---------- wiring ---------- */
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)};
function render(){if(!ready)return;document.getElementById('app').innerHTML={today:vToday,plan:vPlan,cards:vCards,progress:vProgress}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab))}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;render();scrollTo(0,0)}};
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  let el;
  if(el=q('[data-tick]')){const[ei,si]=el.dataset.tick.split('_').map(Number),ex=LOG[TK].sets[ei],s=ex.s[si];const b=best(ex.n);
    s.ok=!s.ok;dirtyToday=true;persist(TK);render();
    if(s.ok){toast(+s.w>b&&b>0?`PR ใหม่! ${s.w} kg`:'บันทึกเซ็ตแล้ว');checkNewCards();awardCoins()}}
  else if(el=q('[data-pose]')){showPose(el.dataset.pose)}
  else if(el=q('[data-cyc]')){const[k,i]=el.dataset.cyc.split('|');const x=C.programs[k].ex[i];const cur=x.icon&&POSES[x.icon]?x.icon:poseOf(x.n,'_');x.icon=POSE_KEYS[(POSE_KEYS.indexOf(cur)+1)%POSE_KEYS.length];persist('settings');render();toast('ภาพท่า: '+POSES[x.icon].th)}
  else if(el=q('[data-card]')){const c=buildCards().find(x=>x.id===el.dataset.card);if(c)showCard(c,false)}
  else if(el=q('[data-filter]')){cardFilter=el.dataset.filter;render()}
  else if(el=q('#logout')){logout()}
  else if(el=q('#openpack')){openPack()}
  else if(el=q('#forgego')){forgeRun()}
  else if(el=q('#forgestop')){FORGE.stop=true}
  else if(el=q('[data-cview]')){cardView=el.dataset.cview;render()}
  else if(el=q('#preview')){const n='Bench Press';let i=0;const show=()=>{const[t,need,l]=TIERS[i];unlockFX({id:'x',name:n,tier:t,need,have:need,got:true,type:'push',hp:80+i*20,sub:'ธาตุดัน · '+l,atkName:'ยกหนักสุด',atk:'80 kg',flavor:'การ์ดตัวอย่าง',foot:'ตัวอย่าง'},1,bt=>{
      bt.textContent=i<TIERS.length-1?'ถัดไป':'ปิด';bt.onclick=ev=>{ev.stopPropagation();i++;if(i<TIERS.length)show();else document.getElementById('ovl').innerHTML=''}})};show()}
  else if(el=q('#addprog')){const k='p'+Date.now().toString(36);C.programs[k]={name:'โปรแกรมใหม่',sub:'',ex:[{n:'ท่าใหม่',s:3,r:10}]};persist('settings');render()}
  else if(el=q('[data-delprog]')){const k=el.dataset.delprog;if(el.dataset.confirm){delete C.programs[k];for(const d in C.plan)if(C.plan[d]===k)C.plan[d]='rest';persist('settings');render()}else{el.dataset.confirm=1;el.textContent='ลบ?';el.style.fontSize='14px'}}
  else if(el=q('[data-addex]')){C.programs[el.dataset.addex].ex.push({n:'ท่าใหม่',s:3,r:10});persist('settings');render()}
  else if(el=q('[data-delex]')){const[k,i]=el.dataset.delex.split('|');C.programs[k].ex.splice(+i,1);persist('settings');render()}
});
app.addEventListener('change',e=>{const d=e.target.dataset,v=e.target.value;
  if(e.target.id==='bulkin'){bulkImport(e.target.files);return}
  if(d.k){LOG[TK].sets[d.e].s[d.s][d.k]=+v||0;dirtyToday=true;persist(TK)}
  else if(d.day){C.plan[d.day]=v;persist('settings');toast('บันทึกแผนแล้ว')}
  else if(e.target.id==='goal'){C.weekGoal=+v;persist('settings')}
  else if(e.target.id==='pick'){pick=v;render()}
  else if(d.pname){C.programs[d.pname].name=v||'ไม่มีชื่อ';persist('settings')}
  else if(d.psub!==undefined){C.programs[d.psub].sub=v;persist('settings')}
  else if(d.ed){const[k,i,f]=d.ed.split('|');C.programs[k].ex[i][f]=f==='n'?(v.trim()||'ท่าใหม่'):Math.max(1,+v||1);persist('settings')}
});
document.getElementById('ovl').addEventListener('click',e=>{if(e.target.id==='packagain'){openPack();return}if(e.target.id==='ovclose'||e.target.id==='ovbg')document.getElementById('ovl').innerHTML='';
  const u=e.target.closest('[data-unart]');if(u){delete C.art[u.dataset.unart];persist('settings');document.getElementById('ovl').innerHTML='';render();toast('กลับไปใช้รูปเดิมแล้ว')}});
document.getElementById('ovl').addEventListener('change',e=>{const k=e.target.dataset.up;if(k&&e.target.files[0])uploadArt(k,e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('ovl').innerHTML=''});
boot();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
